name: Release

# Build and publish a GitHub release for every version tag (v1.3, v1.4, ...).
# Windows (NSIS installer + MSI) and Linux (deb + rpm) are built on their
# native runners via `tauri build`. Release notes are taken from the matching
# "## [X.Y.Z]" section in CHANGELOG.md when present, and GitHub's automatic
# "What's Changed" summary is appended.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            artifacts: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - os: ubuntu-latest
            platform: Linux
            artifacts: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}
    steps:
      # Third-party actions are pinned to full commit SHAs (version in a
      # comment): a mutable tag that ever moves would otherwise run attacker
      # code in a workflow that holds contents:write and the release signing
      # key. Update deliberately by bumping the SHA.
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js (Tauri CLI)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Sync package version with tag (v1.3 -> 1.3.0)
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in
            *.*.*) ;;
            *.*)   V="$V.0" ;;
            *)     V="$V.0.0" ;;
          esac
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$V" != "$CURRENT" ]; then
            npm version --no-git-tag-version "$V"
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version='$V';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
            node -e "const fs=require('fs');const p='src-tauri/Cargo.toml';let t=fs.readFileSync(p,'utf8');const re=/^(version\s*=\s*)\"[^\"]+\"/m;if(!re.test(t))throw new Error('version not found in Cargo.toml [package]');t=t.replace(re,'$1\"$V\"');fs.writeFileSync(p,t)"
            # Cargo.lock embeds the crate's own version; keep it in sync so
            # `cargo test` / `tauri build` don't fail or silently rewrite it.
            cargo update --manifest-path src-tauri/Cargo.toml --package sshspan --precise "$V"
            echo "Version bumped: $CURRENT -> $V"
          else
            echo "Version already $V; nothing to change."
          fi

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers (Tauri)
        run: npm run dist:win
        if: runner.os == 'Windows'

      - name: Build installers (Tauri)
        run: npm run dist:linux -- --bundles deb,rpm,appimage
        if: runner.os == 'Linux'

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Anchored literal-string comparison (avoid dynamic-regex quoting:
          # an escaped "[" in an awk regex opens a character class and never
          # matches, which silently produced an empty body).
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "Changes in this release — see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." > RELEASE_BODY.md
          fi

      # ── Release signing (minisign) ──────────────────────────────────────────
      # Every installer gets a detached minisign signature (`.minisig`) which
      # the in-app updater verifies against the public key embedded in
      # src-tauri/src/commands/updater.rs (MINISIGN_PUBLIC_KEY). This binds the
      # installer to the source tree, so replacing BOTH the binary and its
      # GitHub-computed SHA-256 digest (repo/token compromise) is no longer
      # enough to push a malicious update.
      #
      # MAINTAINER SETUP (one-time, see CHANGELOG "Unreleased" for details):
      #   1. Install minisign (https://jedisct1.github.io/minisign/) and run
      #      `minisign -G -W` locally (the -W keeps the secret key unencrypted,
      #      which this workflow requires; keep the file itself secret).
      #   2. Repo Settings → Secrets and variables → Actions → new secret
      #      MINISIGN_SECRET_KEY whose value is the ENTIRE minisign.key file
      #      (both lines: comment line + base64 secret key line).
      #   3. Paste the base64 body of minisign.pub (the second line, starting
      #      with "RW") into the MINISIGN_PUBLIC_KEY const in
      #      src-tauri/src/commands/updater.rs, replacing the placeholder.
      # Until the secret exists this step is skipped with a warning and the
      # release proceeds unsigned (the updater likewise falls back to the
      # GitHub digest check while that const is still the placeholder).
      - name: Sign installers with minisign
        id: minisign_sign
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          # Pinned upstream release (jedisct1/minisign) + SHA-256 of the
          # downloaded archive, so a substituted "signer" is itself refused.
          MINISIGN_VERSION: '0.12'
          MINISIGN_SHA256_LINUX: '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73'
          MINISIGN_SHA256_WIN64: '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479'
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not configured; skipping release signing. See the workflow comment above this step for the provisioning steps."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # minisign is not preinstalled on the runners: download the pinned
          # upstream release archive and verify it by SHA-256 before use.
          case "$(uname -s)" in
            Linux)
              url="https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
              expected="${MINISIGN_SHA256_LINUX}" ;;
            MINGW*|MSYS*|CYGWIN*)
              url="https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-win64.zip"
              expected="${MINISIGN_SHA256_WIN64}" ;;
            *)
              echo "::error::Unsupported runner OS for the pinned minisign download."; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/minisign-dl" "$url"
          # Hash a bare filename from inside RUNNER_TEMP: on Windows the
          # absolute path contains backslashes, and GNU coreutils escapes an
          # output line with a leading '\' when the filename does — which
          # broke the string comparison below ("got \37b6003…" ≠ expected).
          actual="$(cd "$RUNNER_TEMP" && sha256sum minisign-dl | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::minisign download checksum mismatch (expected $expected, got $actual); refusing to sign with it."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/minisign-bin"
          case "$url" in
            # Archives contain minisign-<ver>-<os>/<arch>/minisign[.exe];
            # keep the inner directory tree and call the right binary below.
            *.tar.gz) tar -xzf "$RUNNER_TEMP/minisign-dl" -C "$RUNNER_TEMP/minisign-bin" ;;
            *.zip)    unzip -oq "$RUNNER_TEMP/minisign-dl" -d "$RUNNER_TEMP/minisign-bin" ;;
          esac
          minisign_bin="$(find "$RUNNER_TEMP/minisign-bin" -type f -name 'minisign*' | grep -E 'x86_64.*/(minisign|minisign.exe)$' | head -n1)"
          if [ -z "$minisign_bin" ]; then
            echo "::error::Could not locate the x86_64 minisign binary in the extracted archive."; exit 1
          fi
          # Write the secret key to a temp file (minisign reads keys from
          # files), sign every bundled installer, then remove the key. The
          # signing key must be an UNENCRYPTED key generated with -W.
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          signed=0
          while IFS= read -r -d '' artifact; do
            "$minisign_bin" -S -s "$keyfile" -m "$artifact" \
              -t "SSHSpan release ${GITHUB_REF_NAME}"
            signed=$((signed + 1))
          done < <(find src-tauri/target -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -path '*/release/bundle/*' -print0)
          if [ "$signed" -eq 0 ]; then
            echo "::error::No installer artifacts found to sign."; exit 1
          fi
          echo "Signed $signed installer(s); .minisig files will be attached to the release."
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ matrix.artifacts }}
      - name: Attach minisign signatures to the GitHub release
        # Runs only when the signing step actually signed (secret present).
        # Each matrix leg uploads only the .minisig files it produced; the
        # other platform's globs do not match on this runner, which the
        # action tolerates (fail_on_unmatched_files defaults to false here).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: steps.minisign_sign.outputs.signed == 'true'
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.minisig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.minisig
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.minisig
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm.minisig
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.minisig
